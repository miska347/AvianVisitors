services:
  birdnet:
    build: .
    container_name: birdnet
    restart: unless-stopped
    ports:
      # Maps port 80 of the host to port 80 of the container.
      # You can change the host port if port 80 is already in use (e.g. 8080:80).
      - "80:80"
    environment:
      - TZ=UTC
      - LATITUDE=0.0
      - LONGITUDE=0.0
      # - GEMINI_API_KEY=your_gemini_api_key
      # - EBIRD_API_KEY=your_ebird_api_key
    devices:
      # Exposes host soundcard to container for live recording
      - "/dev/snd:/dev/snd"
    group_add:
      # Grants container processes permission to access audio devices
      - audio
    volumes:
      # Maps a local 'data' folder on the host for persistent database, recordings and configuration
      - ./data:/data
